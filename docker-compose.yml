services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uga_buses
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/uga_buses
      POLL_INTERVAL: 30
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
